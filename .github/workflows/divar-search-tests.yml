name: Test Divar search preparation
on:
  pull_request:
    paths:
      [
        "services/divar-search/**",
        "data/divar-*.json",
        "test/**",
        "src/**",
        "package.json",
        ".github/workflows/divar-search-tests.yml",
      ]
  push:
    branches: ["agent/divar-aira-prep"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm test
