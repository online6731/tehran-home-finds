name: Publish and refresh catalog
on:
  push:
    branches: [main]
  schedule:
    - cron: '19 */4 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum source pages per category (1–200)'
        required: true
        default: '200'
      category_slugs:
        description: 'Optional comma-separated source categories; empty refreshes all'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: furniture-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh anonymous public source
        id: refresh
        if: github.event_name != 'push'
        env:
          MAX_PAGES: ${{ inputs.max_pages || '200' }}
          CATEGORY_SLUGS: ${{ inputs.category_slugs || '' }}
        run: node src/refresh.mjs
      - name: Preserve refreshed public snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/api/listings.json docs/update-plan/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public listings'
            # UI changes may reach main while the source refresh is running.
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report source availability
        if: steps.refresh.outputs.source_failed == 'true'
        run: |
          echo 'Source retrieval failed for at least one category. The public page displays partial coverage and preserves only unexpired verified ads.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
