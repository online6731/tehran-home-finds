name: Read public listing map coordinates
on:
  workflow_dispatch:
    inputs:
      listing_ids:
        description: '1–100 current catalog IDs, comma separated'
        required: true
        type: string
permissions:
  contents: read
jobs:
  coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public map metadata
        env:
          LISTING_IDS: ${{ inputs.listing_ids }}
        run: node src/location-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: locations
          path: artifacts/locations/
          retention-days: 3
